<!doctype html>
<!--
  mycite-spa-redirect

  Site-root 404 page for GitHub Pages, installed by the MyCite deploy workflow
  (.github/workflows/deploy-pages.yml). Pages only ever serves the 404.html at
  the root of the site, so this is what makes a direct visit or reload of a
  MyCite URL such as /mycite/library work: it sends the browser to the app's
  entry page with the route in `?_route=`, and the app restores it on start
  (apps/web/src/lib/restore-route.ts). Anything outside /mycite/ just gets a
  plain "not found" page.

  The workflow only overwrites a root 404.html that carries the marker above,
  so if you write your own 404 page for the site, keep that marker line in it
  or MyCite deep links will stop working.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <script>
      ;(function () {
        var base = '/mycite/'
        var path = location.pathname
        if (path.indexOf(base) !== 0 || path === base) return
        var route = path.slice(base.length) + location.search
        // Keep the fragment: the Drive sign-in comes back as #drive_session=….
        location.replace(base + '?_route=' + encodeURIComponent(route) + location.hash)
      })()
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #fafafa;
        color: #222;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161616;
          color: #eee;
        }
        a {
          color: #9ecbff;
        }
      }
      main {
        padding: 1rem;
        text-align: center;
      }
    </style>

    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "cf1b63c6e6d4436e96618b4b5f270d7c"}'></script><!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><a href="/">Go to alighavam.com</a></p>
    </main>
  </body>
</html>
